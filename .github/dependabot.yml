version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - npm
    # Supply-chain defense: delay PRs for freshly-published versions so
    # a compromised release (e.g. xz-utils-style attack) has time to be
    # discovered and yanked upstream before Dependabot proposes it here.
    # Patches ship faster than majors because they're lower-risk overall.
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      dev-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
      prod-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
    # Pi packages are the exact audited development SDK (Pi Runtime Audit
    # Edge), not routine grouped bumps. Advance them only with a dedicated
    # audit-edge change. Ignore every update type, not just majors.
    ignore:
      - dependency-name: "@earendil-works/*"
      # 1.2.46 regresses its nested Agent Script language/dialect packages
      # below the aligned runtime toolchain. Allow future versions through.
      - dependency-name: "@sf-agentscript/agentfabric-dialect"
        versions:
          - "1.2.46"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    # Same supply-chain cooldown rationale as the npm ecosystem above.
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
