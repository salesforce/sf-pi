# SPDX-License-Identifier: Apache-2.0
name: External link report

# Network reachability is intentionally outside normal push/PR validation.
# Link outcomes are report-only: repeated 404/410 responses are highlighted,
# while auth/rate-limit/server/transport results remain advisory.
on:
  schedule:
    - cron: "29 8 * * 3" # Wednesday 08:29 UTC
  workflow_dispatch:

concurrency:
  group: external-link-report
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  report:
    name: Check external links
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Generate report
        run: >-
          npm run docs:links:report --
          --output-dir "$RUNNER_TEMP/external-link-report"
          --concurrency 6
          --timeout-ms 15000

      - name: Add report to workflow summary
        if: always()
        run: |
          report="$RUNNER_TEMP/external-link-report/external-links.md"
          if [ -f "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "External-link report generation failed before writing an artifact." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: external-link-report
          path: ${{ runner.temp }}/external-link-report
          if-no-files-found: warn
          retention-days: 30
